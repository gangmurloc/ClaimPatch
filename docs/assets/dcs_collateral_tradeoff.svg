<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">DCS versus collateral-edit trade-off</title>
  <desc id="desc">Scatter plot comparing ClaimPatch with four editing baselines on the 300-step synthetic Qwen diagnostic.</desc>
  <rect width="760" height="500" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .axis { stroke: #57606a; stroke-width: 2; }
    .label { font-size: 14px; }
    .title { font-size: 20px; font-weight: 600; }
    .point-label { font-size: 13px; font-weight: 600; }
  </style>
  <text x="380" y="30" text-anchor="middle" class="title">Dependency coverage versus collateral editing</text>
  <line x1="90" y1="420" x2="700" y2="420" class="axis"/>
  <line x1="90" y1="420" x2="90" y2="60" class="axis"/>
  <line x1="90" y1="348" x2="700" y2="348" class="grid"/>
  <line x1="90" y1="276" x2="700" y2="276" class="grid"/>
  <line x1="90" y1="204" x2="700" y2="204" class="grid"/>
  <line x1="90" y1="132" x2="700" y2="132" class="grid"/>
  <line x1="90" y1="60" x2="700" y2="60" class="grid"/>
  <line x1="212" y1="60" x2="212" y2="420" class="grid"/>
  <line x1="334" y1="60" x2="334" y2="420" class="grid"/>
  <line x1="456" y1="60" x2="456" y2="420" class="grid"/>
  <line x1="578" y1="60" x2="578" y2="420" class="grid"/>
  <line x1="700" y1="60" x2="700" y2="420" class="grid"/>
  <text x="395" y="475" text-anchor="middle" class="label">Collateral edit rate (lower is better) →</text>
  <text x="25" y="240" text-anchor="middle" class="label" transform="rotate(-90 25 240)">Dependency-complete success (higher is better) →</text>
  <text x="90" y="443" text-anchor="middle" class="label">0.0</text>
  <text x="212" y="443" text-anchor="middle" class="label">0.2</text>
  <text x="334" y="443" text-anchor="middle" class="label">0.4</text>
  <text x="456" y="443" text-anchor="middle" class="label">0.6</text>
  <text x="578" y="443" text-anchor="middle" class="label">0.8</text>
  <text x="700" y="443" text-anchor="middle" class="label">1.0</text>
  <text x="74" y="425" text-anchor="end" class="label">0.0</text>
  <text x="74" y="353" text-anchor="end" class="label">0.2</text>
  <text x="74" y="281" text-anchor="end" class="label">0.4</text>
  <text x="74" y="209" text-anchor="end" class="label">0.6</text>
  <text x="74" y="137" text-anchor="end" class="label">0.8</text>
  <text x="74" y="65" text-anchor="end" class="label">1.0</text>
  <circle cx="202" cy="125" r="9" fill="#0969da"/>
  <text x="215" y="116" class="point-label">ClaimPatch (0.183, 0.820)</text>
  <circle cx="226" cy="240" r="7" fill="#8250df"/>
  <text x="239" y="235" class="point-label">Unstructured edit</text>
  <circle cx="90" cy="330" r="7" fill="#1a7f37"/>
  <text x="103" y="325" class="point-label">Attribute-only</text>
  <circle cx="257" cy="60" r="7" fill="#bf8700"/>
  <text x="270" y="80" class="point-label">Descendant-all</text>
  <circle cx="700" cy="60" r="7" fill="#cf222e"/>
  <text x="685" y="82" text-anchor="end" class="point-label">Full regeneration</text>
</svg>
