[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimpatch"
version = "0.2.0"
description = "Dependency-complete semantic patching for evolving LLM answers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "numpy>=1.24",
  "pydantic>=2.6",
  "PyYAML>=6",
  "rich>=13",
  "scipy>=1.10",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
local = [
  "sentence-transformers>=3.2",
  "torch>=2.4",
  "transformers>=4.46",
]

[project.scripts]
claimpatch = "claimpatch.cli:main"
# Backward-compatible command used by the unchanged legacy CI workflow.
decap = "claimpatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
